  <!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>FitRota | Kayit Ol</title>
<link rel="icon" type="image/png" href="dceea2f9-aaab-452e-a951-84cc4370a870.png"> <!-- CHATTEN BAKILDI -->


<style>
  .kayit-paneli {
    box-sizing: border-box;
    width: 92%;
    max-width: 700px;
    margin: 32px auto;
    padding: 28px;
    background: rgba(18, 22, 24, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 18px;
  }
  .ikili-satir {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
    margin-bottom: 20px;
}

.ikili-satir label {
    display: block;
    margin-bottom: 6px;
}

.ikili-satir input,
input[type="email"],
#Seviye {
    box-sizing: border-box;
    width: 100%;
    padding: 10px 12px;
    background-color: #111818;
    border: 1px solid #748985;
    border-radius: 7px;
    color: white;
    font: inherit;
}
/* e posta ıcın yapıldı */
.ikili-satir input::placeholder {
    color: #a7b2af;
}

@media (max-width: 560px) {
    .ikili-satir {
        grid-template-columns: 1fr;
    }
}


.cinsiyet {
    border: 0;
    padding: 0;
    margin: 0 0 20px;
}

.cinsiyet legend {
    padding: 0;
    margin-bottom: 8px;
}

.cinsiyet-secenekleri {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 20px;
}

.cinsiyet-secenekleri input {
    margin: 0;
    accent-color: #36dfb0;
}

.kayit-butonu {
    box-sizing: border-box;
    width: 100%;
    padding: 13px;
    background-color: #36dfb0;
    color: #10221c;
    border: 0;
    border-radius: 9px;
    font: inherit;
    font-weight: bold;
    cursor: pointer;
}

.giris-yazisi {
    text-align: center;
    margin: 16px 0 0;
}

.giris-yazisi a {
    color: #36dfb0;
    font-weight: bold;
}

</style>
<!--  
başlardaki "."bu sınıfa sahip öğeleri seç demek
margin yazı arasında boşluğu ayarlar.
bu kod gri kutucuğa alınmak için yazıldı  ve
 Ad Soyad ve Kullanıcı Adı alanlarının ekranda nasıl 
 duracağını belirledi chatten baktım bu kodları 
 display: grid ve grid-template-columns kutuyu
  iki eşit sütuna böldü. 
 Böylece Ad Soyad sola, Kullanıcı Adı sağa yerleşti
 @media kuralı sayesinde ekran daralınca
  iki alan alt alta geçiyor.
  display: flex ve gap: 10px 20px	Seçenekleri yan yana
   diziyor. 
  Yan yana seçeneklerin arasına 20 piksel koyuyor.
  flex-wrap: wrap	Seçenekler dar ekrana sığmazsa 
  alt satıra geçiriyor.-->

</head>

<body style="background-color: black; color: white;
background-image: linear-gradient(
        rgba(0,0,0,0.45),
        rgba(0,0,0,0.60)
    ), url('kayıt\ ol\ arkaplan\ resmi\ .png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;">

    <div class="kayit-paneli">

    
    <h1 style="color: #36dfb0; text-align: center;">
        FitRota'ya Katıl!
    </h1>

    <p style="text-align: center;">
        Spor yolculuğuna bugün başla. <br> 
        Hemen ücretsiz bir hesap oluştur
    </p>


<form action="login.html">
<div class="ikili-satir">
    <div>
        <label for="name">Ad Soyad</label>
        <input type="text" id="name" name="adsoyad"
               placeholder="👤 Adınızı ve soyadınızı girin" autofocus>
    </div>

    <div>
        <label for="kullanıcıad">Kullanıcı Adı</label>
        <input type="text" id="kullanıcıad" name="kullanıcıadı"
               placeholder="@ Kullanıcı adınızı girin" required>
    </div>
</div>

<label for="E-posta">E-posta</label> <br>
<input type="email"
name="E-posta"
id="E-posta"
size="25"
placeholder="📩 E-posta adresinizi girin"> <br><br>

<div class="ikili-satir">
    <div>
        <label for="password">Şifre</label>
        <input type="password" id="password" name="şifre"
               placeholder="🔒 En az 6 karakter"
               minlength="6" maxlength="12" required>
    </div>

    <div>
        <label for="passwordd">Şifre Tekrar</label>
        <input type="password" id="passwordd" name="şifree"
               placeholder="🔒 Şifrenizi tekrar girin"
               minlength="6" maxlength="12" required>
    </div>
</div>
<!-- minlength="6"	6 karakterden
 kısa bir şifreyle formun gönderilmesini
  engeller.
  maxlength="12"	
  En fazla 12 karakter girilmesine
   izin verir.-->
<label for="">Spor Seviyeniz</label> <br>

<select id="Seviye"> 

   <option value="Seviye seçiniz"> 🏋️Seviye seçiniz</option>
   <option value="başlangıç">Başlangıç</option>
   <option value="orta"> Orta</option>
   <option value="ileri">İleri</option>
</select> <br><br>

<fieldset class="cinsiyet">
    <legend>Cinsiyet</legend>

    <div class="cinsiyet-secenekleri">
        <label><input type="radio" name="Cinsiyet" value="Kadın"> Kadın</label>
        <label><input type="radio" name="Cinsiyet" value="Erkek"> Erkek</label>
        <label><input type="radio" name="Cinsiyet" value="belirtmek istemiyorum"> Belirtmek istemiyorum</label>
    </div>
</fieldset>
<!-- cevresıne kutucuk yaptı-->

<input type="checkbox"required>              
<label for="" style="font-size: 11px;">Kullanım koşullarını kabul ediyorum</label>

<br><br>

<input type="submit" class="kayit-butonu" value="Hesap Oluştur">
<br><br>




</form>

<p class="giris-yazisi">
    Zaten hesabın var mı? <a href="login.html">Giriş yap</a>
</p>

</div>




</body>



</html>
